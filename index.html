<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#20243c" />
    <title>Merge Knights &mdash; 2048 RPG</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="stylesheet" href="./src/styles/main.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>

      <!-- #stage is kept pixel-aligned with the orthographic camera's design box -->
      <div id="stage" class="pre-game">
        <header id="hud-enemy" class="hud">
          <div class="enemy-titlerow">
            <span id="enemy-floor" class="floor-chip">Floor 1</span>
            <span id="enemy-name" class="enemy-name">Enemy</span>
            <span id="enemy-level" class="enemy-level">Lv 1</span>
          </div>
          <div class="bar bar-hp" id="enemy-hp-bar">
            <div class="bar-fill" id="enemy-hp-fill"></div>
            <div class="bar-ghost" id="enemy-hp-ghost"></div>
            <span class="bar-label" id="enemy-hp-text">30 / 30</span>
          </div>
          <div id="enemy-countdown" class="countdown">
            <span class="countdown-text">Enemy attacks in <b>3</b> turns</span>
          </div>
        </header>

        <footer id="hud-player" class="hud">
          <div class="player-row">
            <div class="stat stat-hp">
              <img class="icon" id="icon-hp" alt="" />
              <div class="bar bar-php">
                <div class="bar-fill" id="player-hp-fill"></div>
                <span class="bar-label" id="player-hp-text">100 / 100</span>
              </div>
            </div>
            <div class="stat stat-gold">
              <img class="icon" id="icon-gold" alt="" />
              <span id="player-gold">0</span>
            </div>
          </div>
          <div class="player-row">
            <div class="stat stat-xp">
              <span class="lvl-chip" id="player-level">Lv 1</span>
              <div class="bar bar-xp">
                <div class="bar-fill" id="player-xp-fill"></div>
                <span class="bar-label" id="player-xp-text">0 / 25 XP</span>
              </div>
            </div>
            <div class="stat stat-score">
              <img class="icon" id="icon-atk" alt="" />
              <span id="player-score">0</span>
            </div>
          </div>
          <div id="player-badges" class="badges"></div>
        </footer>

        <div id="toasts"></div>
        <div id="hint" class="hint">Swipe or use <b>WASD</b> / <b>Arrows</b> to merge</div>
      </div>

      <div id="overlay" class="overlay hidden" aria-live="polite"></div>

      <button id="btn-sound" class="corner-btn" title="Toggle sound" aria-label="Toggle sound">
        <img id="icon-sound" alt="" />
      </button>

      <div id="loading" class="loading">
        <div class="loading-title">MERGE KNIGHTS</div>
        <div class="loading-bar"><div id="loading-fill"></div></div>
        <div class="loading-text" id="loading-text">Mustering troops&hellip;</div>
      </div>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
